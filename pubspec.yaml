name: quraan_tafseer
description: "A Quran application with recitations and tafsir."
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ^3.3.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.0.15
  provider: ^6.1.1
  just_audio: ^0.9.32
  http: ^1.2.0
  html: ^0.15.0
  audioplayers: ^5.2.1
  path_provider: ^2.1.2
  cupertino_icons: ^1.0.8
  dio: ^5.4.0
  xml: ^6.1.0
  collection: ^1.18.0
  auto_size_text: ^3.0.0
  connectivity_plus: ^7.0.0
  url_launcher: ^6.3.0

  google_sign_in: ^6.2.1
  googleapis: ^13.1.0
  googleapis_auth: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^5.0.0
  rename_app: ^1.2.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/images/
    - assets/json/
    - assets/json/tafseer/
    - assets/frames/
    - assets/quran-data.xml


  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700


flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
